<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>/terms — 页头预览（LogoFade）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --background:#f9fbfa; --foreground:#111d1a; --muted:#576b66;
    --teal-6:#6efcd90f; --teal-25:#6efcd940;
  }
  body{ background:var(--background); color:var(--foreground);
        font-family:"Geist",ui-sans-serif,system-ui,sans-serif;
        -webkit-font-smoothing:antialiased; margin:0; }
  .wrap{ max-width:672px; margin:0 auto; padding:40px 16px; }
  .h1{ font-size:2.25rem; font-weight:700; letter-spacing:-0.025em; margin:0; }
  .date{ margin-top:24px; font-family:"Geist Mono",ui-monospace,monospace;
         font-size:0.875rem; color:var(--muted); }
  .intro-card{ margin-top:24px; border-radius:1rem; background:var(--teal-6);
               padding:24px; box-shadow:inset 0 0 0 1px var(--teal-25); }
  .intro-card p{ margin:0; font-size:1.125rem; line-height:2rem; }
</style>
</head>
<body>
  <main class="wrap">
    <h1 class="h1">Terms of Service</h1>
    <p class="date">Last updated: October 1, 2026</p>
    <div class="intro-card">
      <p>These terms apply when you use logofade.com (&ldquo;LogoFade&rdquo;, &ldquo;we&rdquo;). By using the site you agree to them. If you do not agree, please do not use it.</p>
    </div>
  </main>
</body>
</html>
